name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test using Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/Test.ps1
      - name: Build source-only package
        shell: powershell
        run: ./scripts/Build.ps1
